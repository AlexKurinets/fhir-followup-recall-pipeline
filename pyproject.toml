[project]
name = "fhir-followup-recall-pipeline"
version = "0.1.0"
description = "Read-only FHIR R4 recall pipeline: clinician-signed rules, minimum-necessary storage, a reason log for every flag, and a call-center worklist."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Kurinets" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recall*", "gateway*", "seed*"]

[tool.setuptools.package-data]
recall = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
